[project]
name = "eleicoes-dashboard"
version = "1.0.0"
description = "Backend do dashboard de apuração em tempo real (dados do TSE)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "pydantic[email]>=2.8",
  "redis>=5.0",
  "httpx>=0.27",
  "cryptography>=43",
  "asn1tools>=0.166",
  "numpy>=1.26",
  "orjson>=3.10",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "tse_fake*"]

[tool.setuptools.package-data]
app = ["data/*.json", "tse/asn1/*.asn1"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "B019"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tse_fake", "tests"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = ["app/collector/main.py", "app/worker/main.py", "app/cli.py"]
