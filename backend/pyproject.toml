[project]
name = "eleicoes-dashboard"
version = "1.0.0"
description = "Backend do dashboard de apuração em tempo real (dados do TSE)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "pydantic[email]>=2.8",
  "redis>=5.0",
  "httpx>=0.27",
  "cryptography>=43",
  "asn1tools>=0.166",
  "numpy>=1.26",
  "orjson>=3.10",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["."]
# Alembic gera os arquivos de migração e eles não são editados à mão.
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "S", "PLR0913"]
ignore = [
  "ANN401",  # Any is sometimes the honest annotation (raw JSON read from the TSE)
  "RUF001",  # ambiguous unicode in strings: product text keeps its accents
  "RUF002",
  "RUF003",
  "RUF012",  # clashes with pydantic's model_config and SQLAlchemy's __table_args__
  "S101",    # assert is used for invariants and to narrow types
  "S311",    # non-cryptographic random: used to draw fake election data
  "N818",    # the exceptions are renamed when the code is migrated to English (see CLAUDE.md)
]

[tool.ruff.lint.per-file-ignores]
# Tests: literal secrets and assert are normal, fixtures are untyped, data lines are long.
"tests/**" = ["S", "ANN", "PLR0913", "E501"]
# The fake TSE serves the mock API; it is a separate deployable with its own rules.
"tse_fake/**" = ["S311"]

[tool.ruff.lint.pylint]
max-args = 7

[tool.ruff.lint.isort]
known-first-party = ["app", "tse_fake", "tests", "tools"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["app", "tse_fake", "tools"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
# asn1tools has no type stubs and its generated code is untyped.
module = ["asn1tools.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The collector/worker loops talk to the TSE and the Redis list API, which are untyped here.
module = ["app.collector.*", "app.worker.*", "app.infra.queue.*", "app.infra.tse.*", "tse_fake.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
disallow_subclassing_any = false
warn_return_any = false

[[tool.mypy.overrides]]
# The query layer builds large dict payloads from SQLAlchemy rows; the rows are Any by nature.
module = ["app.modules.results.queries"]
warn_return_any = false

[tool.function-size]
max-lines = 30
max-file-lines = 300
paths = ["app", "tse_fake", "tools"]

[tool.docs-coverage]
docs = "docs/system"
roots = ["app", "frontend/src", "tests", "tools", "docs", "specs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = [
  "error::DeprecationWarning:app.*",
  "error::DeprecationWarning:tse_fake.*",
  "error::DeprecationWarning:tests.*",
]
markers = [
  "integration: precisa do PostgreSQL de teste (TEST_DATABASE_URL ou testcontainers)",
  "golden: precisa de um arquivo dourado gravado pelo comando de captura",
]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = ["app/collector/main.py", "app/worker/main.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
