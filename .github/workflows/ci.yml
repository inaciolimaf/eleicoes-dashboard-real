# CI = what the Makefile runs: backend lint/types/docs/tests + API contract, frontend checks, e2e.
name: ci

on:
  push:
    branches: [main, claude/electoral-results-realtime-f6ykax]
  pull_request:

jobs:
  back:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eleicoes
          POSTGRES_PASSWORD: eleicoes
          POSTGRES_DB: eleicoes_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eleicoes" --health-interval 2s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://eleicoes:eleicoes@localhost:5432/eleicoes_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python -m tools.function_size
      - run: uv run lint-imports
      - name: compose files parse
        working-directory: .
        run: for f in docker-compose.yml docker-compose.test.yml docker-compose.coolify.yml; do docker compose -f $f config -q; done
      - run: uv run python -m tools.docs_coverage
      - run: uv run mypy
      - run: uv run pytest -q
      - name: contract (frontend types generated from the OpenAPI)
        run: |
          uv run python -m tools.openapi
          cd ../frontend && npm ci --no-audit --no-fund && npm run types
          git diff --exit-code -- src/api/types.ts

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npx tsc --noEmit
      - run: npm run coverage
      - run: npm run build

  e2e:
    needs: [back, web]
    runs-on: ubuntu-latest
    env:
      API_URL: http://localhost:8000
      E2E_EMAIL: e2e@example.com
      E2E_SENHA: e2e-password-with-enough-length
    steps:
      - uses: actions/checkout@v4
      - name: start the system against the fake TSE
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml up -d --build
      - name: wait for the API
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          docker compose -f docker-compose.yml logs api migrate
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chrome
          npm run build
      - working-directory: frontend
        run: npm run e2e && npm run mobile && npm run e2e:flows
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-captures
          path: |
            frontend/captures
            frontend/playwright-report
      - if: failure()
        run: docker compose -f docker-compose.yml logs --tail 200
