# Testes do backend (únicos testes automatizados do projeto):
#   docker compose -f docker-compose.test.yml run --rm --build api-test
name: eleicoes-test

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eleicoes
      POSTGRES_PASSWORD: eleicoes
      POSTGRES_DB: eleicoes_test
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eleicoes"]
      interval: 2s
      retries: 30

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  api-test:
    build: ./backend
    image: eleicoes-backend:latest
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://eleicoes:eleicoes@db-test:5432/eleicoes_test
      TEST_REDIS_URL: redis://redis-test:6379/15
    command: ["sh", "-c", "ruff check app tse_fake tests && pytest -q -p no:warnings --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=85"]
    depends_on:
      db-test: {condition: service_healthy}
      redis-test: {condition: service_healthy}
